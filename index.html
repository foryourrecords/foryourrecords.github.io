<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f766e">
<title>Expense & Mileage Tracker</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#1b2430;--muted:#667085;--line:#e3e8ee;--accent:#0f766e;--accent2:#115e59;--danger:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#10151b;--card:#1a212a;--text:#e7ecf2;--muted:#9aa7b5;--line:#2b3541;--accent:#2dd4bf;--accent2:#5eead4;--danger:#f97066}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--accent);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:18px}
@media (prefers-color-scheme:dark){header{color:#06201d}}
nav{display:flex;gap:4px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:44px;z-index:4;overflow-x:auto}
nav button{flex:1;min-width:80px;padding:12px 8px;border:0;background:none;color:var(--muted);font-size:15px;border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:var(--accent);border-color:var(--accent);font-weight:600}
main{max-width:820px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button.btn{padding:11px 16px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
@media (prefers-color-scheme:dark){button.btn{color:#06201d}}
button.btn.sec{background:var(--bg);color:var(--text);border:1px solid var(--line)}
button.btn.del{background:none;color:var(--danger);border:1px solid var(--line)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.item{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border:0}
.thumb{width:52px;height:52px;border-radius:8px;object-fit:cover;background:var(--bg);flex:none;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:22px}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:13px;color:var(--muted)}
.amt{font-weight:700;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--bg);border-radius:10px;padding:12px}
.stat b{display:block;font-size:22px}
.stat span{font-size:13px;color:var(--muted)}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.photos div{position:relative}
.photos img{width:90px;height:90px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.photos .x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--danger);color:#fff;cursor:pointer;line-height:1}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
td.r,th.r{text-align:right}
.hidden{display:none}
.muted{color:var(--muted);font-size:13px}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:50;padding:10px}
#lightbox img{max-width:100%;max-height:100%}
.gps{text-align:center}
.gps .big{font-size:40px;font-weight:700}
.syncbtn{border:1px solid rgba(255,255,255,.55);background:transparent;color:inherit;border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
#report{display:none}
@media print{
  header,nav,main{display:none!important}
  #report{display:block!important;color:#000;background:#fff;padding:0}
  body{background:#fff}
  .rimg{break-inside:avoid;margin:6px 0}
  .rimg img{max-width:100%;max-height:420px}
}
#report h2{margin:16px 0 6px}
</style>
</head>
<body>
<header style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h1>Expense &amp; Mileage Tracker</h1><button id="syncbtn" class="syncbtn">☁</button></header>
<nav id="nav">
  <button data-v="summary" class="on">Summary</button>
  <button data-v="receipts">Receipts</button>
  <button data-v="mileage">Mileage</button>
  <button data-v="settings">Settings</button>
</nav>
<main id="main"></main>
<div id="report"></div>
<div id="lightbox" onclick="this.style.display='none'"><img id="lbimg"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
// ---------- storage (IndexedDB) ----------
let db;
function openDB(){return new Promise((res,rej)=>{
  const r=indexedDB.open('expense-tracker',1);
  r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('receipts',{keyPath:'id'});d.createObjectStore('trips',{keyPath:'id'});};
  r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error);
});}
const tx=(s,m='readonly')=>db.transaction(s,m).objectStore(s);
const req=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const all=s=>req(tx(s).getAll());
const put=(s,o)=>req(tx(s,'readwrite').put(o));
const rm=(s,id)=>req(tx(s,'readwrite').delete(id));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

const DEF={rate:0.70,autoscan:true,categories:['Meals','Supplies','Fuel','Travel','Software','Equipment','Advertising','Utilities','Other']};
const settings=()=>{try{return Object.assign({},DEF,JSON.parse(localStorage.getItem('et-settings')||'{}'))}catch(e){return {...DEF}}};
const saveSettings=s=>localStorage.setItem('et-settings',JSON.stringify({...s,_u:Date.now()})); // _u = last change, used to sync settings between devices

// ---------- helpers ----------
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>'$'+(Number(n)||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10);
let view='summary', year=String(new Date().getFullYear());
let receipts=[],trips=[];

async function load(){
  receipts=await all('receipts');trips=await all('trips');
  for(const [s,arr] of [['receipts',receipts],['trips',trips]])for(const r of arr){let ch=false;
    if(!r.updated){r.updated=Date.now();ch=true}
    {const ph=r.photos||[],p=r.pids||[];if(p.length!==ph.length||!r.photos){r.photos=ph;r.pids=ph.map((_,i)=>p[i]||uid());ch=true}} // receipts and trips can both carry photos
    if(ch)await put(s,r);}
  receipts.sort((a,b)=>b.date.localeCompare(a.date));trips.sort((a,b)=>b.date.localeCompare(a.date));
}
function years(){const s=new Set([String(new Date().getFullYear())]);[...receipts,...trips].forEach(x=>s.add(x.date.slice(0,4)));return [...s].sort().reverse();}

// ---- receipt parser ----
const MONTHS={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function parseAmounts(line){const out=[];const re=/(?:^|[^\d])\$?\s?(\d{1,3}(?:,\d{3})+|\d+)[.,](\d{2})(?!\d)/g;let m;
  while((m=re.exec(line)))out.push(parseFloat(m[1].replace(/,/g,'')+'.'+m[2]));return out;}
function pickTotal(lines){
  const good=/grand\s*total|amount\s*due|balance\s*due|total\s*due|\btotal\b/i,bad=/sub\s*-?\s*total|\btax\b|\btip\b|change|cash|tender|discount|saving|points|reward/i;
  let best=null;
  lines.forEach((l,i)=>{if(!good.test(l)||bad.test(l))return;
    let a=parseAmounts(l);if(!a.length&&lines[i+1])a=parseAmounts(lines[i+1]);
    if(a.length){const v=a[a.length-1];best=(best===null||/grand|due/i.test(l))?v:Math.max(best,v)}});
  return best; // no guessing: if no clear total line is found, leave the amount for the user
}
function parseDate(text){
  const now=new Date(),min=new Date(now.getFullYear()-3,0,1),max=new Date(now.getTime()+86400000);
  const ok=(y,m,d)=>{if(y<100)y+=2000;if(!m)return null;const dt=new Date(y,m-1,d);if(dt.getMonth()!==m-1||dt.getDate()!==d||dt<min||dt>max)return null;
    return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`};
  const mon='(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\\.?';
  const pats=[
    [/(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})(?!\d)/g,a=>ok(+a[1],+a[2],+a[3])],
    [/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4}|\d{2})(?!\d)/g,a=>ok(+a[3],+a[1],+a[2])],
    [new RegExp('\\b'+mon+'\\s+(\\d{1,2})(?:st|nd|rd|th)?,?\\s+(\\d{4})','gi'),a=>ok(+a[3],MONTHS[a[1].toLowerCase()],+a[2])],
    [new RegExp('\\b(\\d{1,2})\\s+'+mon+',?\\s+(\\d{4})','gi'),a=>ok(+a[3],MONTHS[a[2].toLowerCase()],+a[1])]];
  for(const [re,f] of pats){let a;while((a=re.exec(text))){const r=f(a);if(r)return r}}
  return null;
}
function parseVendor(lines){
  for(const raw of lines.slice(0,8)){
    let l=raw.replace(/[^A-Za-z0-9&'.\- ]/g,' ').replace(/\s+/g,' ').trim();
    const letters=(l.match(/[A-Za-z]/g)||[]).length;
    if(letters<3||letters<l.length*0.5)continue;
    const words=l.split(' ').filter(w=>/[A-Za-z]/.test(w)),longest=Math.max(0,...words.map(w=>w.replace(/[^A-Za-z]/g,'').length));
    if(longest<4&&letters<7)continue;            // too short to trust
    if(words.length>2&&letters/words.length<3)continue; // looks like OCR noise ("Sn an am")
    if(/receipt|invoice|welcome|thank|order|\btel\b|phone|www\.|\.com|^\d{2,}\b|street|\bst\b|\bave\b|\broad\b|\brd\b|suite|store\s*#|cashier|server|table/i.test(l))continue;
    if(l===l.toUpperCase())l=l.toLowerCase().replace(/\b[a-z]/g,c=>c.toUpperCase());
    return l.slice(0,50);}
  return '';
}
const CATMAP=[
  ['Fuel',/\b(gas|fuel|shell|exxon|chevron|bp|mobil|sunoco|valero|texaco|marathon|speedway|unleaded|gallons?|pump)\b/i],
  ['Meals',/\b(restaurant|cafe|coffee|grill|pizza|burger|diner|kitchen|bistro|taco|sushi|bbq|starbucks|mcdonald'?s?|subway|wendy'?s?|chipotle|dunkin)\b/i],
  ['Travel',/\b(hotel|inn|motel|airlines?|airport|uber|lyft|parking|taxi|rental|amtrak|toll)\b/i],
  ['Software',/\b(software|subscription|license|cloud|hosting|saas|domain)\b/i],
  ['Supplies',/\b(office|staples|depot|supplies|paper|ink|toner|hardware|lowe'?s)\b/i],
  ['Utilities',/\b(electric|water|internet|wireless|verizon|comcast|spectrum|utility)\b/i],
  ['Advertising',/\b(advertis\w*|marketing|banner)\b/i]];
function guessCategory(text,cats){for(const [c,re] of CATMAP)if(re.test(text)){const hit=cats.find(x=>x.toLowerCase()===c.toLowerCase());if(hit)return hit}return ''}
function parseReceipt(text,cats){
  const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  return {vendor:parseVendor(lines),amount:pickTotal(lines),date:parseDate(text),category:guessCategory(text,cats||[])};
}
// ---- end parser ----
// OCR runs in the browser (Tesseract.js); photos never leave the device.
let tessLoad=null;
function loadTess(){return tessLoad||(tessLoad=new Promise((res,rej)=>{const s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js';
  s.onload=()=>res(window.Tesseract);s.onerror=()=>{tessLoad=null;rej(new Error('Could not load the receipt reader. Check your internet connection.'))};document.head.appendChild(s)}))}
async function ocr(dataUrl,onProgress){const T=await loadTess();
  const r=await T.recognize(dataUrl,'eng',{logger:m=>{if(m.status==='recognizing text'&&onProgress)onProgress(Math.round(m.progress*100))}});return r.data.text}

// compress image to JPEG data URL
function compress(file,max=1600,q=0.75){return new Promise((res,rej)=>{
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q));};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Could not read image'))};img.src=url;});}
function zoom(src){$('#lbimg').src=src;$('#lightbox').style.display='flex';}

// ---------- views ----------
let inForm=false;
function render(){
  inForm=false;updateStatus();
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  ({summary:vSummary,receipts:vReceipts,mileage:vMileage,settings:vSettings})[view]();
}
document.getElementById('nav').onclick=e=>{if(e.target.dataset.v){view=e.target.dataset.v;render();window.scrollTo(0,0)}};

function yearPicker(){return `<select id="yr" style="width:auto">${years().map(y=>`<option ${y===year?'selected':''}>${y}</option>`).join('')}</select>`}
function bindYear(){const y=$('#yr');if(y)y.onchange=()=>{year=y.value;render()}}

function totals(){
  const r=receipts.filter(x=>x.date.startsWith(year)),t=trips.filter(x=>x.date.startsWith(year));
  const by={};r.forEach(x=>by[x.category]=(by[x.category]||0)+Number(x.amount));
  const spent=r.reduce((a,x)=>a+Number(x.amount),0),miles=t.reduce((a,x)=>a+Number(x.miles),0);
  return {r,t,by,spent,miles,ded:miles*settings().rate};
}

function vSummary(){
  const T=totals();
  $('#main').innerHTML=`
  ${homeCards()}
  <div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">Tax year</h3>${yearPicker()}</div>
   <div class="stats" style="margin-top:12px">
    <div class="stat"><b>${money(T.spent)}</b><span>Receipts (${T.r.length})</span></div>
    <div class="stat"><b>${T.miles.toFixed(1)} mi</b><span>Business miles (${T.t.length} trips)</span></div>
    <div class="stat"><b>${money(T.ded)}</b><span>Mileage deduction @ ${money(settings().rate)}/mi</span></div>
    <div class="stat"><b>${money(T.spent+T.ded)}</b><span>Total deductible</span></div>
   </div>
   <p class="muted" style="margin-bottom:0">Using the standard mileage rate? It already covers most car costs such as gas and repairs, so ask your accountant before deducting those separately.</p></div>
  <div class="card"><h3 style="margin-top:0">By category</h3>
   ${Object.keys(T.by).length?`<table>${Object.entries(T.by).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="r">${money(v)}</td></tr>`).join('')}</table>`:'<p class="muted">No receipts this year yet.</p>'}</div>
  ${clientCard(T)}
  <div class="card"><h3 style="margin-top:0">Export ${year}</h3>
   <div class="actions"><button class="btn" id="pkg">📦 Accountant package (ZIP)</button><button class="btn sec" id="stmx">🧾 Client statement</button></div>
   <p class="muted">One file for your accountant: summary, receipts and mileage spreadsheets, a printable report, and every receipt photo sorted by category.</p>
   <div class="actions"><button class="btn sec" id="csvR">Receipts CSV</button><button class="btn sec" id="csvT">Mileage CSV</button><button class="btn sec" id="pdf">PDF report with photos</button></div>
   <p class="muted">The report includes your receipt photos. Open it and use Print → Save as PDF.</p></div>`;
  wireHome();bindYear();$('#pkg').onclick=e=>packageExport(e.currentTarget);$('#stmx').onclick=()=>statementView();
  document.querySelectorAll('.stmbtn').forEach(b=>b.onclick=()=>statementView(b.dataset.c));$('#csvR').onclick=()=>csv('receipts');$('#csvT').onclick=()=>csv('trips');$('#pdf').onclick=report;
}

async function download(name,text,type='text/csv'){
  const blob=text instanceof Blob?text:new Blob([text],{type});
  try{const d=await window.claude?.use?.('downloads');
    if(d){await d.save({filename:name,data:blob});return}}catch(e){if(e&&e.code==='user_declined')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
function csv(kind){
  const T=totals();
  if(kind==='receipts'){
    download(`receipts-${year}.csv`,'Date,Vendor,Category,Client,Billable,Amount,Notes,Has Photo\n'+[...T.r].sort((a,b)=>a.date.localeCompare(b.date)).map(x=>[x.date,q(x.vendor),q(x.category),q(x.client),x.billable?'Yes':'',Number(x.amount).toFixed(2),q(x.notes),(x.photos||[]).length?'Yes':'No'].join(',')).join('\n'));
  }else{
    const rate=settings().rate;
    download(`mileage-${year}.csv`,'Date,From,To,Purpose,Client,Billable,Odometer Start,Odometer End,Miles,Round Trip,Deduction,Has Screenshot\n'+[...T.t].sort((a,b)=>a.date.localeCompare(b.date)).map(x=>[x.date,q(x.from),q(x.to),q(x.purpose),q(x.client),x.billable?'Yes':'',x.odoStart??'',x.odoEnd??'',Number(x.miles).toFixed(1),x.roundTrip?'Yes':'',(x.miles*rate).toFixed(2),(x.photos||[]).length?'Yes':'No'].join(',')).join('\n'));
  }
}
async function report(){
  const body=reportBody();
  let d=null;try{d=await window.claude?.use?.('downloads')}catch(e){}
  if(d){
    const html=`<!doctype html><html><head><meta charset="utf-8"><title>Expense Report ${year}</title><style>body{font:14px system-ui,sans-serif;max-width:800px;margin:20px auto;padding:0 16px;color:#000}table{width:100%;border-collapse:collapse}td,th{padding:5px 4px;border-bottom:1px solid #ccc;text-align:left}.r{text-align:right}.rimg{break-inside:avoid;margin:10px 0}.rimg img{max-width:100%;max-height:420px;display:block;margin:4px 0}@media print{button{display:none}}</style></head><body><button onclick="print()">Print / Save as PDF</button>${body}</body></html>`;
    download(`expense-report-${year}.html`,html,'text/html');
  }else{$('#report').innerHTML=body;setTimeout(()=>window.print(),150);}
}
function reportBody(srcOf=x=>x.photos||[]){
  const T=totals(),rate=settings().rate;
  const rs=[...T.r].sort((a,b)=>a.date.localeCompare(b.date)),ts=[...T.t].sort((a,b)=>a.date.localeCompare(b.date));
  return `<h1>Expense &amp; Mileage Report — ${year}</h1>
  <p>Receipts: <b>${money(T.spent)}</b> · Miles: <b>${T.miles.toFixed(1)}</b> × ${money(rate)} = <b>${money(T.ded)}</b> · Total: <b>${money(T.spent+T.ded)}</b></p>
  <h2>By category</h2><table>${Object.entries(T.by).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="r">${money(v)}</td></tr>`).join('')}</table>
  <h2>Mileage log</h2><table><tr><th>Date</th><th>From → To</th><th>Purpose</th><th class="r">Miles</th></tr>${ts.map(x=>`<tr><td>${x.date}</td><td>${esc(x.from)} → ${esc(x.to)}</td><td>${esc(x.purpose)}</td><td class="r">${Number(x.miles).toFixed(1)}</td></tr>`).join('')}</table>
  <h2>Receipts</h2>${rs.map(x=>`<div class="rimg"><b>${x.date} — ${esc(x.vendor)}</b> · ${esc(x.category)} · ${money(x.amount)}${x.notes?`<br>${esc(x.notes)}`:''}<br>${srcOf(x).map(p=>`<img src="${p}">`).join('')}</div>`).join('')}`;
}

// ---- accountant package (ZIP, built in the browser, no libraries) ----
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC_T[(c^u8[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function makeZip(files){
  const enc=new TextEncoder(),parts=[],central=[];let off=0,csize=0;
  const d=new Date(),dd=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate(),tm=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1);
  for(const f of files){
    const name=enc.encode(f.name),data=f.data,crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,tm,true);lh.setUint16(12,dd,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);lh.setUint16(26,name.length,true);lh.setUint16(28,0,true);

    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,tm,true);ch.setUint16(14,dd,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);ch.setUint16(28,name.length,true);
    ch.setUint32(42,off,true);
    central.push(ch.buffer,name);csize+=46+name.length;
    off+=30+name.length+data.length;
  }
  const e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,csize,true);e.setUint32(16,off,true);

function dataUrlBytes(u){const b=atob(u.split(',')[1]),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}

const REPORT_CSS='body{font:14px system-ui,sans-serif;max-width:800px;margin:20px auto;padding:0 16px;color:#000}table{width:100%;border-collapse:collapse}td,th{padding:5px 4px;border-bottom:1px solid #ccc;text-align:left}.r{text-align:right}.rimg{break-inside:avoid;margin:10px 0}.rimg img{max-width:100%;max-height:420px;display:block;margin:4px 0}@media print{button{display:none}}';

function buildPackageFiles(){
  const T=totals(),rate=settings().rate,enc=new TextEncoder();
  const rs=[...T.r].sort((a,b)=>a.date.localeCompare(b.date)),ts=[...T.t].sort((a,b)=>a.date.localeCompare(b.date));
  const files=[],used=new Set(),paths=new Map();
  rs.forEach(x=>{const cat=slug(x.category,20),list=[];paths.set(x.id,list);
    (x.photos||[]).forEach((p,i)=>{
      const base=`receipts/${cat}/${x.date}_${slug(x.vendor)}_${Number(x.amount).toFixed(2)}`+((x.photos.length>1)?`_p${i+1}`:'');
      let n=base,k=2;while(used.has(n))n=base+'_'+k++;used.add(n);
      list.push(n+'.jpg');files.push({name:n+'.jpg',data:dataUrlBytes(p)});});});
  // route screenshots kept with trips go into mileage-proof/
  const tpaths=new Map();
  ts.forEach(t=>{const list=[];tpaths.set(t.id,list);
    (t.photos||[]).forEach((p,i)=>{
      const base=`mileage-proof/${t.date}_${slug(t.to)}_${Number(t.miles).toFixed(1)}mi`+((t.photos.length>1)?`_p${i+1}`:'');
      let n=base,k=2;while(used.has(n))n=base+'_'+k++;used.add(n);
      list.push(n+'.jpg');files.push({name:n+'.jpg',data:dataUrlBytes(p)});});});
  const cell=v=>typeof v==='number'?String(v):q(v);
  const csvOf=rows=>enc.encode('﻿'+rows.map(r=>r.map(cell).join(',')).join('\r\n')+'\r\n');
  const n2=v=>Number(Number(v).toFixed(2));
  files.push({name:'Receipts.csv',data:csvOf([['Date','Vendor','Category','Client','Billable','Amount','Notes','Receipt file(s)'],
    ...rs.map(x=>[x.date,x.vendor,x.category,x.client||'',x.billable?'Yes':'',n2(x.amount),x.notes||'',(paths.get(x.id)||[]).join('; ')]),['','','TOTAL','','',n2(T.spent),'',''] ])});
  files.push({name:'Mileage-Log.csv',data:csvOf([['Date','From','To','Business purpose','Client','Billable','Odometer start','Odometer end','Miles','Round trip','Deduction ($)','Route screenshot(s)'],
    ...ts.map(x=>[x.date,x.from||'',x.to||'',x.purpose||'',x.client||'',x.billable?'Yes':'',x.odoStart??'',x.odoEnd??'',Number(Number(x.miles).toFixed(1)),x.roundTrip?'Yes':'',n2(x.miles*rate),(tpaths.get(x.id)||[]).join('; ')]),
    ['','','','TOTAL','','','','',Number(T.miles.toFixed(1)),'',n2(T.ded),''] ])});
  const bc=byClient(T.r,T.t,rate);
  files.push({name:'By-Client.csv',data:csvOf([['Client','Receipts ($)','Receipt count','Miles','Mileage ($)','Billable ($)','To invoice ($)','Total ($)'],
    ...bc.map(r=>[r.client||'(no client)',n2(r.receipts),r.rcount,Number(r.miles.toFixed(1)),n2(r.miles*rate),n2(r.billable),n2(r.toInvoice),n2(r.receipts+r.miles*rate)]),
    ['TOTAL',n2(T.spent),T.r.length,Number(T.miles.toFixed(1)),n2(T.ded),n2(bc.reduce((a,r)=>a+r.billable,0)),n2(bc.reduce((a,r)=>a+r.toInvoice,0)),n2(T.spent+T.ded)] ])});
  files.push({name:'Summary.csv',data:csvOf([['Category','Total ($)'],
    ...Object.entries(T.by).sort((a,b)=>b[1]-a[1]).map(([k,v])=>[k,n2(v)]),
    ['Receipts total',n2(T.spent)],['',''],['Business miles',Number(T.miles.toFixed(1))],['Mileage rate ($ per mile)',rate],['Mileage deduction ($)',n2(T.ded)],['',''],['Total deductible ($)',n2(T.spent+T.ded)] ])});
  const html=`<!doctype html><html><head><meta charset="utf-8"><title>Expense Report ${year}</title><style>${REPORT_CSS}</style></head><body><button onclick="print()">Print / Save as PDF</button>${reportBody(x=>paths.get(x.id)||[])}</body></html>`;
  files.push({name:'Report.html',data:enc.encode(html)});
  files.push({name:'README.txt',data:enc.encode(
`Expense & Mileage package for ${year}
Generated ${today()}

Summary.csv      Totals by category, mileage deduction and total deductible
By-Client.csv    Receipts, mileage and the billable amount for each client
Receipts.csv     Every receipt, with the matching photo file name
Mileage-Log.csv  Every trip with odometer readings, miles and deduction
Report.html      Printable report (open it, then Print > Save as PDF)
receipts/        Receipt photos, sorted into a folder per category
mileage-proof/   Route screenshots saved with trips, when you added them

Mileage rate used: $${rate} per mile. Confirm it matches the IRS standard rate for ${year}.
This package lists what was entered in the app. It is not tax advice.
`)});
  return {files,count:{r:rs.length,t:ts.length,p:files.filter(f=>f.name.startsWith('receipts/')).length}};
}
async function packageExport(btn){
  const T=totals();
  if(!T.r.length&&!T.t.length){alert(`There is nothing to export for ${year} yet.`);return}
  const label=btn.textContent;btn.disabled=true;btn.textContent='Building package…';
  try{await new Promise(r=>setTimeout(r,30));const {files}=buildPackageFiles();await download(`expense-package-${year}.zip`,makeZip(files),'application/zip')}
  catch(e){alert('Could not build the package: '+(e.message||e))}
  btn.disabled=false;btn.textContent=label;
}

// Google Maps directions link (works without any key; opens the Maps app or site).
function mapsDirUrl(from,to){
  const p=new URLSearchParams({api:'1',destination:String(to||''),travelmode:'driving'});
  if(from)p.set('origin',String(from));
  return 'https://www.google.com/maps/dir/?'+p.toString();}
// Distances shown on a Google Maps directions screen, e.g. "18 min (12.4 mi)" -> [{miles:12.4,raw:'12.4 mi'}], in reading order.
function parseRouteMiles(text){
  const out=[],re=/(\d{1,3}(?:,\d{3})+|\d+)(?:[.,](\d{1,2}))?\s*(miles?|mi|kilometers?|km)\b/gi;let m;
  while((m=re.exec(String(text||'')))){
    let n=parseFloat(m[1].replace(/,/g,'')+(m[2]?'.'+m[2]:''));
    if(/^k/i.test(m[3]))n=n/1.609344;
    if(n>0&&n<2000)out.push({miles:Math.round(n*10)/10,raw:m[0].replace(/\s+/g,' ').trim()});}
  return out;}
// Icons and buttons next to an address are read as junk ("pp, nx a = bonsack"). Drop leading junk words:
// symbols and 1-2 letter lowercase fragments. Short real words like "NW" or "5" are kept. All-lowercase text is capitalised.
function cleanMapLine(raw){
  const toks=String(raw||'').replace(/\s+/g,' ').trim().split(' ');
  const junk=t=>/^[^A-Za-z0-9]+$/.test(t)||/^[a-z]{1,2}[^A-Za-z0-9]*$/.test(t);
  let i=0;while(i<toks.length-1&&junk(toks[i]))i++;
  let s=toks.slice(i).join(' ').replace(/^[^A-Za-z0-9]+/,'').replace(/[\s|]+$/,'');
  if(s&&!/[A-Z]/.test(s))s=s.replace(/\b([a-z])/g,c=>c.toUpperCase());
  return s;}
// The From and To boxes at the top of a Google Maps directions screen (everything above the mode / time / distance row).
// When Maps used "Your location" as the start, `from` is blank and fromIsMyLocation is true.
function parseRouteAddresses(text){
  const lines=String(text||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const stop=lines.findIndex(l=>/^(driving|transit|walking|cycling|biking|rideshare|flights?)\b/i.test(l)
    ||/\b\d+\s*(?:min|mins|hr|hrs|h)\b/i.test(l)||/\b\d+(?:[.,]\d+)?\s*(?:mi|miles|km)\b/i.test(l));
  if(stop<1)return {found:false};
  let mine=false,tFrom=false,tTo=false;
  const labels=/^(your location|my location|current location|starting point|choose starting point.*|choose destination.*|destination|add stop|from|to|directions)$/i;
  const ui=/^(leave now|options|route options|add stop|add a stop|steps|start|preview|share|search|search here|explore|go|save|more|menu|back|close|edit|swap|reverse|arrive|depart|send directions|set (?:home|work)|your places|saved|updates)\b/i;
  const cands=[];
  for(const raw of lines.slice(0,stop)){
    if((raw.match(/[A-Za-z]/g)||[]).length<4)continue;                       // status bar bits: 10:42, 5G, 89%
    let s=cleanMapLine(raw);
    const cut=/(…|\.\.\.)$/.test(s);if(cut)s=s.replace(/(…|\.\.\.)$/,'').trim();
    if((s.match(/[A-Za-z]/g)||[]).length<4)continue;
    if(s.length<30&&/\b(your|my|current)\s+location\b/i.test(s)){mine=true;continue}
    if(!s||labels.test(s)||ui.test(s))continue;
    cands.push({s,cut});}
  if(!cands.length)return {found:false};
  // With extra lines above the route, keep the ones that look like addresses (digits, commas, street words).
  const score=x=>(/\d/.test(x.s)?2:0)+(/,/.test(x.s)?2:0)+(/\b(st|street|ave|avenue|rd|road|dr|drive|blvd|boulevard|ln|lane|way|ct|court|hwy|highway|pkwy|parkway|pl|place|suite|ste)\b/i.test(x.s)?2:0)+(/\s/.test(x.s)?1:0);
  if(cands.length>2){const good=cands.filter(x=>score(x)>=2);if(good.length>=1){cands.length=0;cands.push(...good)}}
  const to=cands[cands.length-1];
  if(mine)return {found:true,from:'',to:to.s,fromIsMyLocation:true,truncated:{from:false,to:to.cut}};
  if(cands.length>=2){const from=cands[cands.length-2];return {found:true,from:from.s,to:to.s,fromIsMyLocation:false,truncated:{from:from.cut,to:to.cut}}}
  return {found:true,from:'',to:to.s,fromIsMyLocation:false,truncated:{from:false,to:to.cut}};}

// ---- address completion (pure) ----
// Google Maps drops the city, state and ZIP from the address boxes. We keep the street or place name that was read
// and add the missing locality from a map lookup.
const hasStateZip=s=>/\b\d{5}(?:-\d{4})?\s*$/.test(String(s||'').trim())||/,\s*[A-Za-z]{2}\s*$/.test(String(s||'').trim());
function stateAbbr(a){const iso=a&&a['ISO3166-2-lvl4'];if(iso&&/^[A-Z]{2}-[A-Z0-9]{1,3}$/.test(iso))return iso.split('-')[1];return (a&&a.state)||''}
function localityOf(a,skip){const sk=String(skip||'').toLowerCase();
  return [a.city,a.town,a.village,a.municipality,a.hamlet,a.suburb,a.county].find(n=>n&&!sk.includes(String(n).toLowerCase()))||''}
function completeAddress(partial,a){
  const p=String(partial||'').trim();if(!p||!a||hasStateZip(p))return p;
  const st=stateAbbr(a);if(!st)return p;
  // ZIPs are only trusted for street addresses; a ZIP attached to a place name (a neighborhood or hamlet) can be wrong.
  const loc=localityOf(a,p),zip=(a.house_number||a.road)?(a.postcode||''):'';
  return [p,loc].filter(Boolean).join(', ')+', '+st+(zip?' '+zip:'');}
// ---- end address completion ----

// Keep your own categories (add the preset's missing ones) or replace them; "Other" always stays last.
function mergeCategories(existing,preset,replace){
  const base=replace?[]:[...(existing||[])],seen=new Set(base.map(x=>x.toLowerCase()));
  for(const c of preset||[])if(!seen.has(c.toLowerCase())){base.push(c);seen.add(c.toLowerCase())}
  const i=base.findIndex(x=>x.toLowerCase()==='other');if(i>=0&&i!==base.length-1)base.push(base.splice(i,1)[0]);
  return base;}
function mergePurposes(existing,preset,replace){
  const base=replace?[]:[...(existing||[])],seen=new Set(base.map(x=>x.toLowerCase()));
  for(const c of preset||[])if(!seen.has(c.toLowerCase())){base.push(c);seen.add(c.toLowerCase())}
  return base;}
function applyPreset(cur,p,opt){return {...cur,profession:p.id,categories:mergeCategories(cur.categories,p.categories,opt.replace),purposes:mergePurposes(cur.purposes,p.purposes,opt.replace)}}

// Snap a typed client name to an existing one, ignoring case and extra spaces.
function canonClient(v,names){const t=String(v||'').replace(/\s+/g,' ').trim();if(!t)return '';const hit=(names||[]).find(n=>n.toLowerCase()===t.toLowerCase());return hit||t}
// Totals per client for a set of receipts and trips. Items with no client are grouped last.
function byClient(rs,ts,rate){
  const m=new Map(),row=n=>{const k=n||'';if(!m.has(k))m.set(k,{client:k,receipts:0,rcount:0,miles:0,tcount:0,billable:0,toInvoice:0});return m.get(k)};
  rs.forEach(x=>{const o=row(x.client),a=Number(x.amount)||0;o.receipts+=a;o.rcount++;if(x.billable){o.billable+=a;if(!x.invoiced)o.toInvoice+=a}});
  ts.forEach(x=>{const o=row(x.client),a=(Number(x.miles)||0)*rate;o.miles+=Number(x.miles)||0;o.tcount++;if(x.billable){o.billable+=a;if(!x.invoiced)o.toInvoice+=a}});
  return [...m.values()].sort((a,b)=>((a.client==='')-(b.client===''))||((b.receipts+b.miles*rate)-(a.receipts+a.miles*rate)));
}

const cents=n=>Math.round((Number(n)||0)*100)/100;
// Billable items for one client, optionally limited to a date range and to items not yet invoiced.
function statementItems(recs,tripList,client,opt){
  const ok=x=>x.client===client&&x.billable&&(!opt.from||x.date>=opt.from)&&(!opt.to||x.date<=opt.to)&&(!opt.onlyNew||!x.invoiced);
  const byDate=(a,b)=>a.date.localeCompare(b.date);

// Each mileage line is rounded to cents first, so the lines always add up to the printed total.
function statementTotals(rs,ts,rate){
  const exp=cents(rs.reduce((a,x)=>a+cents(x.amount),0));
  const lines=ts.map(t=>({t,amt:cents((Number(t.miles)||0)*rate)}));
  const mile=cents(lines.reduce((a,l)=>a+l.amt,0));
  return {exp,mile,miles:Math.round(ts.reduce((a,t)=>a+(Number(t.miles)||0),0)*10)/10,total:cents(exp+mile),lines};
}
function statementBody(o){

// ---- distance logic ----
// Driving distance from OpenStreetMap services (Nominatim for addresses, OSRM for routes).
// The two addresses are sent to those public services only when the user taps an Estimate button.
const geoCache=()=>{try{return JSON.parse(localStorage.getItem('et-geo')||'{}')}catch(e){return {}}};
const saveGeo=c=>{try{localStorage.setItem('et-geo',JSON.stringify(c))}catch(e){}};
async function fetchJson(url,ms=12000){const ac=new AbortController(),t=setTimeout(()=>ac.abort(),ms);
  try{const r=await fetch(url,{signal:ac.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}
  catch(e){throw new Error(e.name==='AbortError'?'The map service took too long. Try again.':'Could not reach the map service ('+(e.message||'network error')+').')}
  finally{clearTimeout(t)}}
// "Blue Cafe, 12 Main St, Roanoke VA" -> full text, then without the business name, then without the second part.
function addressCandidates(a){
  const parts=String(a||'').split('\n')[0].split(',').map(s=>s.trim()).filter(Boolean),out=[];
  for(let i=0;i<Math.min(parts.length,3);i++){const c=parts.slice(i).join(', ');if(c.length>=5&&!out.includes(c))out.push(c)}
  return out;}
const shortName=n=>String(n||'').split(',').slice(0,3).join(',').trim();
// ---- end distance logic ----
let lastGeo=0;
async function geocode(addr,near,needAddr){
  const key=normPlace(addr)+(near?`@${near.lat.toFixed(1)},${near.lon.toFixed(1)}`:''),cache=geoCache();if(cache[key]&&(!needAddr||cache[key].addr))return cache[key];
  // prefer results close to the starting point (a soft hint, not a limit)
  const bias=near?`&viewbox=${near.lon-0.7},${near.lat+0.7},${near.lon+0.7},${near.lat-0.7}`:'';
  for(const cand of addressCandidates(addr)){
    const wait=1100-(Date.now()-lastGeo);if(wait>0)await new Promise(r=>setTimeout(r,wait));lastGeo=Date.now();
    const j=await fetchJson('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&addressdetails=1&q='+encodeURIComponent(cand)+bias);
    if(j&&j[0]){const p={lat:+j[0].lat,lon:+j[0].lon,name:j[0].display_name||cand,addr:j[0].address||null};cache[key]=p;saveGeo(cache);return p}}
  throw new Error(`Couldn't find "${addr}" on the map. A full street address works best.`);}
const MAX_EST_MILES=250;
async function estimateMiles(from,to){
  // The starting point anchors everything, so it must be a real street address ("Home office" matches random places).
  if(!/\d/.test(from))throw new Error('Use a street address for the starting point (for example 123 Main St, Roanoke VA) so the route is accurate.');
  const a=await geocode(from),b=await geocode(to,a);
  const j=await fetchJson(`https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=false`);
  const m=j&&j.routes&&j.routes[0]&&j.routes[0].distance;if(!(m>0))throw new Error('No driving route found between those places.');
  const miles=Math.round(m/1609.344*10)/10,r={miles,fromName:shortName(a.name),toName:shortName(b.name)};
  if(miles>MAX_EST_MILES)throw new Error(`That route is about ${miles} mi, which looks too far, so I did not fill it in. Matched: ${r.fromName} → ${r.toName}. Check the addresses, or type the miles yourself.`);
  return r;}

// ---- calendar logic ----
const normPlace=s=>String(s||'').toLowerCase().replace(/\s+/g,' ').trim();
// Pure: turns calendar events into trip suggestions (skips cancelled, declined, no-location, already-added and dismissed).
function eventsToSuggestions(items,calId,existingKeys,skippedKeys){
  return (items||[]).filter(e=>e&&e.status!=='cancelled'&&e.location&&e.start&&!(e.attendees||[]).some(a=>a.self&&a.responseStatus==='declined'))
    .map(e=>{const when=e.start.dateTime||e.start.date;
      return {key:`${calId}|${e.id}|${when}`,date:when.slice(0,10),title:(e.summary||'(no title)').trim(),location:e.location.split('\n')[0].trim(),
        emails:(e.attendees||[]).filter(a=>!a.self&&a.email&&!a.resource).map(a=>String(a.email).toLowerCase())}})
    .filter(s=>s.location&&!existingKeys.has(s.key)&&!skippedKeys.has(s.key));
}
// Pure: client (and billable flag) from the most recent saved trip to the same place.
function knownClient(tripList,place){const t=[...tripList].sort((a,b)=>b.date.localeCompare(a.date)).find(t=>normPlace(t.to)===normPlace(place)&&t.client);return t?{client:t.client,billable:!!t.billable}:{client:'',billable:false}}
// Pure: miles from the most recent saved trip to the same place, or ''.
function knownMiles(tripList,place){const t=[...tripList].sort((a,b)=>b.date.localeCompare(a.date)).find(t=>normPlace(t.to)===normPlace(place)&&Number(t.miles)>0);return t?Number(t.miles):''}
// ---- client matching (pure) ----
const FREE_MAIL=new Set(['gmail.com','googlemail.com','outlook.com','hotmail.com','live.com','msn.com','yahoo.com','icloud.com','me.com','aol.com','proton.me','protonmail.com']);
const emailDomain=e=>String(e||'').split('@')[1]||'';
const reEscape=s=>String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const hasWord=(text,w)=>new RegExp('(^|[^a-z0-9])'+reEscape(String(w).toLowerCase())+'([^a-z0-9]|$)').test(String(text).toLowerCase());
const shortClient=c=>String(c).replace(/[\s,]+(corp|corporation|inc|incorporated|llc|ltd|limited|co|company|group|llp|lp|plc|pllc|pc)\.?$/i,'').trim();
// "Acme Corp = acme, acmecorp.com, jane@partner.com" -> [{client, keys:[...]}]
function parseRules(text){return String(text||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const i=l.indexOf('=');if(i<1)return null;
  return {client:l.slice(0,i).trim(),keys:l.slice(i+1).split(',').map(k=>k.trim()).filter(Boolean)}}).filter(r=>r&&r.client&&r.keys.length)}
// Your own rules first, then client names that appear in the event title or location.
function matchClient(ev,clients,rules){
  const text=`${ev.title||''}\n${ev.location||''}`,emails=ev.emails||[],doms=emails.map(emailDomain).filter(Boolean);
  for(const r of rules||[])for(const k of r.keys){const kl=k.toLowerCase();
    if(kl.includes('@')){if(emails.includes(kl))return {client:canonClient(r.client,clients),why:`attendee ${k}`}}
    else if(/^[^\s]+\.[a-z]{2,}$/.test(kl)){if(doms.some(d=>d===kl||d.endsWith('.'+kl)))return {client:canonClient(r.client,clients),why:`attendee at ${k}`}}
    else if(hasWord(text,kl))return {client:canonClient(r.client,clients),why:`mentions “${k}”`};}
  const list=[...(clients||[])].sort((a,b)=>b.length-a.length);
  for(const c of list)if(c.length>=3&&hasWord(text,c))return {client:c,why:`mentions “${c}”`};
  // "Beta LLC" is usually called just "Beta": drop company suffixes, but only when that leaves one unambiguous client.
  const shorts=list.map(shortClient);
  for(let i=0;i<list.length;i++){const sc=shorts[i];
    if(sc.length>=3&&sc!==list[i]&&shorts.filter(x=>x.toLowerCase()===sc.toLowerCase()).length===1&&hasWord(text,sc))return {client:list[i],why:`mentions “${sc}”`}}
  return null;}
// Company email domains learned from trips you have already confirmed (personal email domains are ignored).
function matchLearned(ev,learned){for(const d of (ev.emails||[]).map(emailDomain)){if(!d||FREE_MAIL.has(d))continue;
  const k=Object.keys(learned||{}).find(k=>d===k||d.endsWith('.'+k));if(k)return {client:learned[k],why:`attendee at ${k}`}}return null}
function learnDomains(learned,pairs){const out={...(learned||{})};for(const p of pairs||[]){if(!p.client)continue;
  for(const e of p.emails||[]){const d=emailDomain(e);if(d&&!FREE_MAIL.has(d))out[d]=p.client}}return out}
// Whether this client's most recent trip was billable (used as the default for a new trip).
function clientBillableDefault(tripList,client){const t=[...tripList].sort((a,b)=>b.date.localeCompare(a.date)).find(t=>t.client===client);return t?!!t.billable:false}
// ---- end calendar logic ----
let ctok=null,ctokExp=0;
const learnedDomains=()=>{try{return JSON.parse(localStorage.getItem('et-dom')||'{}')}catch(e){return {}}};
function getCalToken(interactive){return new Promise((res,rej)=>{
  if(ctok&&Date.now()<ctokExp-60000)return res(ctok);
  const cid=GS().cid;if(!cid)return rej(new Error('Google sign-in is not set up.'));
  if(!window.google?.accounts?.oauth2)return rej(new Error('Google sign-in did not load. Check your internet connection.'));
  const c=google.accounts.oauth2.initTokenClient({client_id:cid,scope:'https://www.googleapis.com/auth/calendar.readonly',hint:EMAIL,
    callback:r=>{if(r.error)return rej(new Error(r.error_description||r.error));ctok=r.access_token;ctokExp=Date.now()+r.expires_in*1000;res(ctok)},
    error_callback:e=>rej(new Error(e.type||'sign-in cancelled'))});
  c.requestAccessToken({prompt:interactive?'':'none'});});}
async function calApi(path){
  const r=await fetch('https://www.googleapis.com/calendar/v3/'+path,{headers:{Authorization:'Bearer '+ctok}});
  if(!r.ok){const t=await r.text();throw new Error(r.status===403&&/accessNotConfigured|has not been used|is disabled/i.test(t)?'The Google Calendar API is not turned on for this app yet.':'Calendar error '+r.status+': '+t.slice(0,120))}
  return r.json();}
const skipKeys=()=>{try{return new Set(JSON.parse(localStorage.getItem('et-cal-skip')||'[]'))}catch(e){return new Set()}};
function calTrips(){
  inForm=true;
  const toD=today(),fromD=new Date(Date.now()-14*864e5).toISOString().slice(0,10);
  $('#main').innerHTML=`<div class="card"><h3 style="margin-top:0">Trips from your calendar</h3>
   <p class="muted">Finds calendar events that have a location, so you can turn them into trips. Events are read on your device only, and nothing is saved unless you add the trip. The app asks Google for read-only calendar access.</p>
   <div class="row"><div><label>From</label><input type="date" id="cf" value="${fromD}"></div><div><label>To</label><input type="date" id="ct" value="${toD}"></div></div>
   <label>Where your trips start (used as “From”; a street address works best for mile estimates)</label><input id="chome" value="${esc(settings().home||'')}" placeholder="e.g. 123 Main St, Roanoke VA">
   <div id="cals"></div>
   <div class="actions"><button class="btn" id="cfind">Find trips</button><button class="btn sec" id="cback">Back</button></div>
   <p class="muted" id="cmsg" aria-live="polite"></p></div><div id="cres"></div>`;

        $('#cals').dataset.loaded='1';}

      localStorage.setItem('et-cals',JSON.stringify(ids));

      const min=new Date($('#cf').value+'T00:00:00'),max=new Date($('#ct').value+'T00:00:00');max.setDate(max.getDate()+1);

}
function drawSugg(sugg,home){
  const box=$('#cres');

  box.innerHTML=clientDatalist()+purposeDatalist()+sugg.map((s,i)=>{const km=knownMiles(trips,s.location),kc=knownClient(trips,s.location);
    // client guess: your rules and client names, then the same place as an earlier trip, then learned company domains
    const m1=matchClient(s,names,rules),m2=(!m1&&!kc.client)?matchLearned(s,learned):null;
    let cli='',bill=false,why='';
    if(m1){cli=m1.client;bill=clientBillableDefault(trips,cli);why=`Matched: ${m1.why}`}
    else if(kc.client){cli=kc.client;bill=kc.billable;why='Same place as an earlier trip'}
    else if(m2){cli=m2.client;bill=clientBillableDefault(trips,cli);why=`Matched: ${m2.why}`}
    return `<div class="card csug" data-i="${i}">
     <label style="display:flex;gap:8px;align-items:center;color:var(--text);margin:0;font-size:16px"><input type="checkbox" class="sk" style="width:auto" ${km?'checked':''}> <b>${esc(s.date)}</b> · ${esc(s.title)}</label>
     <div class="muted" style="margin-top:4px">${esc(s.location)}${km?` · last time: ${km} mi`:''} · <a href="${esc(mapsDirUrl(home,s.location))}" target="_blank" rel="noopener">Open in Google Maps</a></div>
     ${s.emails&&s.emails.length?`<div class="muted">With: ${esc(s.emails.slice(0,3).join(', '))}${s.emails.length>3?` +${s.emails.length-3} more`:''}</div>`:''}
     <div class="row"><div><label>From</label><input class="sf" value="${esc(home)}"></div><div><label>Miles</label><input class="sm" type="number" step="0.1" inputmode="decimal" value="${km}"></div></div>
     <div class="actions" style="margin-top:6px"><button class="btn sec sest">📍 Estimate miles</button></div>
     <p class="muted smsg" aria-live="polite"></p>
     <label>Purpose</label><input class="sp" list="purposes" autocomplete="off" value="${esc(s.title)}">
     <div class="row"><div><label>Client (optional)</label><input class="sc" list="clients" value="${esc(cli)}" autocomplete="off"></div>
       <div><label style="display:flex;gap:6px;align-items:center;margin-top:30px;color:var(--text);font-size:15px"><input type="checkbox" class="sb" style="width:auto" ${bill?'checked':''}> Billable</label></div></div>
     ${why?`<div class="muted cwhy">${esc(why)}</div>`:''}
     <label style="display:flex;gap:8px;align-items:center;color:var(--text)"><input type="checkbox" class="sr" style="width:auto"> Round trip (counts the miles twice)</label>
     <div class="actions"><button class="btn del sdel">Not a business trip</button></div></div>`}).join('')+
    (sugg.length?'<p class="muted">Estimates use OpenStreetMap and send the two addresses to that service when you tap an Estimate button. They are one-way driving miles, so tick “Round trip” if you came back the same way.</p><div class="actions"><button class="btn sec" id="cestall">📍 Estimate all missing miles</button><button class="btn" id="cadd">Add ticked trips</button></div><p class="muted" id="cestmsg" aria-live="polite"></p>':'');
  const estCard=async(card)=>{
    const s=sugg[+card.dataset.i],msg=card.querySelector('.smsg'),btn=card.querySelector('.sest'),from=card.querySelector('.sf').value.trim();
    if(!from){msg.textContent='Enter a starting address first.';return false}
    btn.disabled=true;msg.textContent='Looking up the route…';
    try{const r=await estimateMiles(from,s.location),sm=card.querySelector('.sm');sm.value=r.miles;sm.dispatchEvent(new Event('input'));
      msg.textContent=`About ${r.miles} mi one way by road. Matched: ${r.fromName} → ${r.toName}. Please check it looks right.`;btn.disabled=false;return true}
    catch(e){msg.textContent=e.message||'Could not estimate the distance.';btn.disabled=false;return false}};
  box.querySelectorAll('.csug').forEach(card=>{
    const s=sugg[+card.dataset.i];
    card.querySelector('.sm').addEventListener('input',e=>{if(parseFloat(e.target.value)>0)card.querySelector('.sk').checked=true});
    card.querySelector('.sest').onclick=()=>estCard(card);
    card.querySelector('.sdel').onclick=()=>{const k=skipKeys();k.add(s.key);localStorage.setItem('et-cal-skip',JSON.stringify([...k]));card.remove()};});
  const add=$('#cadd');if(!add)return;
  $('#cestall').onclick=async()=>{
    const b=$('#cestall'),m=$('#cestmsg');b.disabled=true;let n=0,fail=0;
    const todo=[...box.querySelectorAll('.csug')].filter(c=>!parseFloat(c.querySelector('.sm').value));
    if(!todo.length){m.textContent='Every trip already has miles.';b.disabled=false;return}
    for(const c of todo){m.textContent=`Estimating ${n+fail+1} of ${todo.length}…`;(await estCard(c))?n++:fail++}
    m.textContent=`Estimated ${n} of ${todo.length}.`+(fail?' The rest need a street address in “From” or miles typed by hand.':' Please check each one.');b.disabled=false;};
  add.onclick=async()=>{
    const picks=[],pairs=[];
    for(const card of box.querySelectorAll('.csug')){
      if(!card.querySelector('.sk').checked)continue;
      const s=sugg[+card.dataset.i],m=parseFloat(card.querySelector('.sm').value);
      if(!(m>0)){alert(`Enter the miles for "${s.title}" on ${s.date}, or untick it.`);card.querySelector('.sm').focus();return}
      picks.push({id:uid(),date:s.date,from:card.querySelector('.sf').value.trim(),to:s.location,purpose:card.querySelector('.sp').value.trim(),
        client:canonClient(card.querySelector('.sc').value,clientNames()),billable:card.querySelector('.sb').checked,odoStart:null,odoEnd:null,miles:Math.round(m*(card.querySelector('.sr').checked?2:1)*10)/10,roundTrip:card.querySelector('.sr').checked,evId:s.key,updated:Date.now()});
      pairs.push({client:picks[picks.length-1].client,emails:s.emails});}
    if(!picks.length){alert('Tick the trips you want to add.');return}
    for(const t of picks)await put('trips',t);
    try{localStorage.setItem('et-dom',JSON.stringify(learnDomains(learnedDomains(),pairs)))}catch(e){}
    year=picks[picks.length-1].date.slice(0,4);await load();view='mileage';render();autoSync();};
}

// GPS tracking
function hav(a,b){const R=3958.8,r=Math.PI/180,dLa=(b.lat-a.lat)*r,dLo=(b.lon-a.lon)*r;
  const x=Math.sin(dLa/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
function gpsView(){inForm=true;
  if(!navigator.geolocation){alert('GPS is not available in this browser.');return}
  $('#main').innerHTML=`<div class="card gps"><h3 style="margin-top:0">GPS trip tracker</h3>
   <p><b>Works only while this screen stays on and the app is open.</b> A web app can't track in the background. For trips where you can't keep the screen on, type the addresses instead and attach a Google Maps screenshot.</p>
   <div class="big" id="gm">0.0 mi</div><div class="muted" id="gs">Ready</div>
   <div class="actions" style="justify-content:center"><button class="btn" id="go">Start</button><button class="btn sec" id="back">Back</button></div>
   <p class="muted">Keep this screen open while driving — browsers pause tracking when the screen is off. GPS needs https (or localhost). For long trips, odometer entry is more reliable.</p></div>`;
  $('#back').onclick=()=>{if(gps){navigator.geolocation.clearWatch(gps.id);gps=null}render()};
  $('#go').onclick=()=>{
    if(!gps){
      gps={dist:0,last:null,wake:null};
      navigator.wakeLock?.request('screen').then(w=>gps&&(gps.wake=w)).catch(()=>{});
      gps.id=navigator.geolocation.watchPosition(p=>{
        if(p.coords.accuracy>50){$('#gs').textContent='Waiting for better signal…';return}
        const c={lat:p.coords.latitude,lon:p.coords.longitude};
        if(gps.last){const d=hav(gps.last,c);if(d>0.01){gps.dist+=d;gps.last=c}}else gps.last=c;
        $('#gm').textContent=gps.dist.toFixed(1)+' mi';$('#gs').textContent='Tracking…';
      },e=>{$('#gs').textContent='GPS unavailable here ('+e.message+'). Use odometer or manual entry.'},{enableHighAccuracy:true,maximumAge:0});
      $('#go').textContent='Stop & save';$('#gs').textContent='Starting…';
    }else{
      navigator.geolocation.clearWatch(gps.id);gps.wake?.release?.();const m=Math.round(gps.dist*10)/10;gps=null;
      tripForm(null,m);
    }};
}

// ---------- Google Drive sync ----------
const EMAIL='roanoketechconsultants@gmail.com',API='https://www.googleapis.com/drive/v3',UP='https://www.googleapis.com/upload/drive/v3';
const DEFAULT_CID='535782394451-5h50p63mpfghgj05vp0ncmt3bt1ug1bf.apps.googleusercontent.com';
const GS=()=>{try{return {cid:DEFAULT_CID,...JSON.parse(localStorage.getItem('et-g')||'{}')}}catch(e){return {cid:DEFAULT_CID}}};
const setG=o=>localStorage.setItem('et-g',JSON.stringify({...GS(),...o}));
function queueDel(n){const l=JSON.parse(localStorage.getItem('et-del')||'[]');if(!l.includes(n)){l.push(n);localStorage.setItem('et-del',JSON.stringify(l))}}
let tok=null,tokExp=0,syncing=false,again=false,syncErr='';

function statusText(){const g=GS();if(!g.cid)return '☁ Set up sync';if(!g.on)return '☁ Connect';if(syncing)return '☁ Syncing…';if(syncErr)return '☁ Tap to retry';
  return '☁ Synced'+(g.last?' '+new Date(g.last).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'');}
function updateStatus(){const b=$('#syncbtn');if(b)b.textContent=statusText();const s=$('#gstat');if(s)s.textContent=syncErr||statusText();}
$('#syncbtn').onclick=()=>{if(!GS().cid){view='settings';render();return}syncNow(true)};

function getToken(interactive){return new Promise((res,rej)=>{
  if(tok&&Date.now()<tokExp-60000)return res(tok);
  const cid=GS().cid;if(!cid)return rej(new Error('Enter your Google client ID in Settings first.'));
  if(!window.google?.accounts?.oauth2)return rej(new Error('Google sign-in did not load. Check your internet connection.'));
  const c=google.accounts.oauth2.initTokenClient({client_id:cid,scope:'https://www.googleapis.com/auth/drive.file',hint:EMAIL,
    callback:r=>{if(r.error)return rej(new Error(r.error_description||r.error));tok=r.access_token;tokExp=Date.now()+r.expires_in*1000;res(tok)},
    error_callback:e=>rej(new Error(e.type||'sign-in cancelled'))});
  c.requestAccessToken({prompt:interactive?'':'none'});
});}
async function api(url,opt={}){
  const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+tok}});
  if(!r.ok){throw new Error('Drive error '+r.status+': '+(await r.text()).slice(0,160))}return r;}
async function checkAccount(){
  const j=await (await api(`${API}/about?fields=user(emailAddress)`)).json(),e=(j.user?.emailAddress||'').toLowerCase();
  if(e!==EMAIL){try{google.accounts.oauth2.revoke(tok)}catch(x){}tok=null;tokExp=0;setG({on:0});throw new Error(`You signed in as ${e}. This app saves to ${EMAIL} — tap Connect and pick that account.`)}}
async function ensureFolder(){
  let id=GS().folder;
  if(id){try{const j=await (await api(`${API}/files/${id}?fields=id,trashed`)).json();if(!j.trashed)return id}catch(e){}}
  const q=encodeURIComponent("mimeType='application/vnd.google-apps.folder' and name='Receipt & Mileage Tracker' and trashed=false");
  const j=await (await api(`${API}/files?q=${q}&fields=files(id)`)).json();
  if(j.files[0])id=j.files[0].id;
  else id=(await (await api(`${API}/files?fields=id`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'Receipt & Mileage Tracker',mimeType:'application/vnd.google-apps.folder'})})).json()).id;
  setG({folder:id});return id;}
async function listAll(folder){let out=[],pt='';
  do{const q=encodeURIComponent(`'${folder}' in parents and trashed=false`);
    const j=await (await api(`${API}/files?q=${q}&pageSize=1000&fields=nextPageToken,files(id,name,appProperties)${pt?'&pageToken='+pt:''}`)).json();
    out=out.concat(j.files);pt=j.nextPageToken||'';}while(pt);return out;}
async function upload(folder,name,blob,mime,props,existingId){
  const meta={name,appProperties:props||{}};if(!existingId)meta.parents=[folder];
  const b='b'+uid();
  const body=new Blob([`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: ${mime}\r\n\r\n`,blob,`\r\n--${b}--`]);
  const url=`${UP}/files${existingId?'/'+existingId:''}?uploadType=multipart&fields=id`;
  return (await api(url,{method:existingId?'PATCH':'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body})).json();}
const toBlob=u=>fetch(u).then(r=>r.blob());
const toURL=b=>new Promise((res,rej)=>{const f=new FileReader();f.onload=()=>res(f.result);f.onerror=rej;f.readAsDataURL(b)});

async function pull(store,f,byName){
  const j=await (await api(`${API}/files/${f.id}?alt=media`)).json();
  const old=(await req(tx(store).get(j.id)))||{};let rec={...j,_s:j.updated};
  if(store==='receipts'||store==='trips'){const ph=[],pp=[];
    for(const p of j.pids||[]){const i=(old.pids||[]).indexOf(p);
      if(i>=0&&old.photos?.[i]){ph.push(old.photos[i]);pp.push(p);continue}
      const pf=byName.get(`p_${p}.jpg`);if(!pf)continue;
      ph.push(await toURL(await (await api(`${API}/files/${pf.id}?alt=media`)).blob()));pp.push(p);}
    rec.photos=ph;rec.pids=pp;}
  await put(store,rec);}
async function push(store,pre,rec,folder,byName,f){
  if(store==='receipts'||store==='trips')for(let i=0;i<(rec.pids||[]).length;i++){const n=`p_${rec.pids[i]}.jpg`;
    if(!byName.has(n)){const r=await upload(folder,n,await toBlob(rec.photos[i]),'image/jpeg',{});byName.set(n,{id:r.id,name:n})}}
  const {photos,_s,...meta}=rec;
  await upload(folder,`${pre}${rec.id}.json`,new Blob([JSON.stringify(meta)],{type:'application/json'}),'application/json',{updated:String(rec.updated)},f?.id);
  await put(store,{...rec,_s:rec.updated});}

async function syncNow(interactive){
  if(syncing){again=true;return}
  syncing=true;syncErr='';updateStatus();
  try{
    await getToken(interactive);await checkAccount();setG({on:1});
    const folder=await ensureFolder(),byName=new Map((await listAll(folder)).map(f=>[f.name,f]));
    for(const n of JSON.parse(localStorage.getItem('et-del')||'[]')){const f=byName.get(n);
      if(f){await api(`${API}/files/${f.id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({trashed:true})});byName.delete(n)}}
    localStorage.setItem('et-del','[]');
    for(const [store,pre] of [['receipts','r_'],['trips','t_']]){
      const seen=new Set();
      for(const rec of await all(store)){
        const name=`${pre}${rec.id}.json`,f=byName.get(name);seen.add(name);
        const ru=f?Number(f.appProperties?.updated||0):0;
        if(f&&ru>rec.updated)await pull(store,f,byName);
        else if(!f&&rec._s)await rm(store,rec.id);
        else if(!f||rec.updated>ru)await push(store,pre,rec,folder,byName,f);}
      for(const [name,f] of [...byName])if(name.startsWith(pre)&&name.endsWith('.json')&&!seen.has(name))await pull(store,f,byName);}
    // settings (categories, rate, clients, business details, rules) follow you between devices; the newest change wins
    {const f=byName.get('settings.json'),ru=Number(f?.appProperties?.updated||0),cur=settings(),lu=Number(cur._u||0);
     if(f&&ru>lu){const j=await (await api(`${API}/files/${f.id}?alt=media`)).json();if(j&&typeof j==='object')localStorage.setItem('et-settings',JSON.stringify(j))}
     else if(lu&&(!f||lu>ru))await upload(folder,'settings.json',new Blob([JSON.stringify(cur)],{type:'application/json'}),'application/json',{updated:String(lu)},f?.id);}
    setG({last:Date.now()});await load();
  }catch(e){syncErr=interactive?e.message:(/Drive error|Enter your|did not load|You signed/.test(e.message)?e.message:'Tap ☁ to sign in to Google again.');}
  syncing=false;updateStatus();if(!inForm&&!syncErr)render();
  if(again){again=false;syncNow(false)}
}
function autoSync(){const g=GS();if(g.cid&&g.on&&navigator.onLine)syncNow(false)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)autoSync()});
window.addEventListener('online',autoSync);

// ---------- boot ----------
openDB().then(load).then(render).then(autoSync).catch(e=>{$('#main').innerHTML='<div class="card">Storage unavailable: '+esc(e.message||e)+'</div>'});
navigator.storage?.persist?.();
</script>
